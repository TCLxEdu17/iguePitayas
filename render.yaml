services:
  - type: web
    name: iguebananas
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node .next/standalone/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: iguebananas-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: NODE_ENV
        value: production

databases:
  - name: iguebananas-db
    plan: free
    databaseName: iguebananas
    user: iguebananas
